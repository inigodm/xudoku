<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            background: radial-gradient(circle at top center, #171f33 0%, #0b1326 100%);
            color: theme('colors.on-background');
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-3d-primary {
            position: relative;
            transition: all 0.1s ease;
            transform: translateY(-4px);
        }
        .btn-3d-primary:active {
            transform: translateY(0px);
        }
        .btn-3d-primary-shadow {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            transform: translateY(4px);
            z-index: -1;
        }

        .neon-text-error {
            text-shadow: 0 0 15px rgba(255, 180, 171, 0.4);
        }
        .cracked-icon {
            filter: drop-shadow(0 0 15px rgba(255, 180, 171, 0.4));

<body class="min-h-screen flex flex-col overflow-hidden pb-24 md:pb-0 font-body-md bg-background text-on-background">
<!-- Top App Bar -->
<header class="w-full top-0 sticky bg-background/80 backdrop-blur-xl flex justify-between items-center px-container-padding py-stack-md z-40 hidden md:flex shadow-none">
<button class="active:translate-y-1 transition-transform hover:opacity-80">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-display-lg text-headline-lg-mobile tracking-tighter text-primary">SUDOKU</h1>
<div class="flex items-center gap-6">
<a class="text-primary hover:opacity-80 font-label-lg text-label-lg flex items-center gap-2 active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined">grid_view</span> Jugar
            </a>
<a class="text-outline hover:text-primary hover:opacity-80 font-label-lg text-label-lg flex items-center gap-2 active:scale-90 duration-150 transition-colors" href="#">
<span class="material-symbols-outlined">leaderboard</span> Ránking
            </a>
<a class="text-outline hover:text-primary hover:opacity-80 font-label-lg text-label-lg flex items-center gap-2 active:scale-90 duration-150 transition-colors" href="#">
<span class="material-symbols-outlined">person</span> Perfil
            </a>
<a class="text-outline hover:text-primary hover:opacity-80 active:translate-y-1 transition-transform" href="#">
<span class="material-symbols-outlined">settings</span>
</a>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-container-padding z-10 relative">
<!-- Icon/Graphic -->
<div class="mb-stack-lg animate-pulse cracked-icon">
<span class="material-symbols-outlined text-[80px] text-error" style="font-variation-settings: 'FILL' 1;">
                heart_broken
            </span>
</div>
<!-- Title & Subtitle -->
<div class="text-center mb-stack-lg">
<h1 class="font-display-lg text-display-lg text-error mb-stack-sm neon-text-error uppercase tracking-wider">
                ¡FIN DEL JUEGO!
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant font-display-lg">
                Te has quedado sin oportunidades.
            </p>
</div>
<!-- Stats Grid (Bento style) -->
<div class="grid grid-cols-2 gap-stack-md w-full max-w-md mb-stack-lg">
<div class="glass-panel rounded-xl p-stack-md flex flex-col items-center justify-center gap-2 shadow-lg border-error/10">
<span class="material-symbols-outlined text-error mb-1" style="font-variation-settings: 'FILL' 1;">
                    cancel
                </span>
<span class="font-label-sm text-label-sm text-outline uppercase">Errores</span>
<span class="font-headline-lg text-headline-lg text-on-background">3/3</span>
</div>
<div class="glass-panel rounded-xl p-stack-md flex flex-col items-center justify-center gap-2 shadow-lg border-error/10">
<span class="material-symbols-outlined text-tertiary mb-1" style="font-variation-settings: 'FILL' 0;">
                    timer
                </span>
<span class="font-label-sm text-label-sm text-outline uppercase">Tiempo</span>
<span class="font-headline-lg text-headline-lg text-on-background">12:45</span>
</div>
</div>

<button class="w-full h-16 relative active:scale-95 transition-transform duration-150">
<div class="btn-3d-primary-shadow bg-error-container/40"></div>
<div class="btn-3d-primary w-full h-full bg-error-container rounded-xl flex items-center justify-center gap-3 text-on-error-container font-headline-lg-mobile text-headline-lg-mobile">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">

                </span>
<span>Ver Anuncio para Continuar</span>
</div>
</button>
<button class="w-full h-14 glass-panel rounded-xl flex items-center justify-center gap-2 text-error font-label-lg text-label-lg uppercase tracking-widest active:bg-white/10 transition-colors">

</button>

<span class="material-symbols-outlined">emoji_events</span>
<span class="font-label-sm text-label-sm">Badges</span>
</a>

<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-secondary-fixed-dim transition-all active:translate-y-1 duration-150 ease-out" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
