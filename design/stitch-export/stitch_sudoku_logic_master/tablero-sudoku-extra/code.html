<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .btn-3d-primary {
            position: relative;
            transition: transform 0.1s ease;
        }
        .btn-3d-primary:active {
            transform: translateY(3px) scale(0.95);
        }
        .btn-3d-shadow {
            position: absolute;
            top: 4px;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            z-index: -1;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-3d-primary:active .btn-3d-shadow {
            box-shadow: 0 0 10px rgba(192, 193, 255, 0.4);
        }
        .cell-glow-cyan {
            box-shadow: inset 0 0 15px rgba(76, 215, 246, 0.3);
        }
        
        /* Active Cell Pulse */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 2px #c0c1ff, inset 0 0 5px rgba(192, 193, 255, 0.2); }
            50% { box-shadow: 0 0 0 3px #8083ff, inset 0 0 15px rgba(192, 193, 255, 0.5); }
            100% { box-shadow: 0 0 0 2px #c0c1ff, inset 0 0 5px rgba(192, 193, 255, 0.2); }
        }
        .cell-active {
            animation: pulse-glow 2s infinite ease-in-out;
            z-index: 10;
        }

        /* Ambient Background */
        @keyframes ambient-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .ambient-bg {
            background: linear-gradient(-45deg, #0b1326, #131b2e, #060e20, #0b1326);
            background-size: 400% 400%;
            animation: ambient-bg 15s ease infinite;
        }

        /* Grid Entrance Animation */
        @keyframes cell-enter {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        .sudoku-cell {
            opacity: 0; /* Starts hidden */
            animation: cell-enter 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Pop Animation for Input */
        @keyframes pop-in {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #fff; text-shadow: 0 0 10px #c0c1ff; }
            100% { transform: scale(1); }
        }
        .cell-pop {
            animation: pop-in 0.3s ease-out;
        }

        /* Floating Score Animation */
        @keyframes float-up-fade {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.8);
            }
            20% {
                opacity: 1;
                transform: translateY(0) scale(1.1);
            }
            80% {
                opacity: 1;
                transform: translateY(-20px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-30px) scale(0.9);
            }
        }
        .floating-score {
            position: absolute;
            pointer-events: none;
            animation: float-up-fade 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: #4cd7f6; /* Tertiary color */
            text-shadow: 0 0 8px rgba(76, 215, 246, 0.8), 0 0 12px rgba(111, 0, 190, 0.5);
            z-index: 50;
        }
        
        .neon-grid {
            background-color: #0b1326;
            background-image: 
                linear-gradient(rgba(144, 143, 160, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(144, 143, 160, 0.1) 1px, transparent 1px);
            background-size: 33.33% 33.33%;
        }
    </style>

<script>
        // Floating Score Function
        function showFloatingScore(element, scoreText = "+100") {
            const rect = element.getBoundingClientRect();
            const gridRect = document.getElementById('sudoku-grid').getBoundingClientRect();
            
            // Calculate position relative to the grid container
            const top = rect.top - gridRect.top;
            const left = rect.left - gridRect.left;
            
            const scoreEl = document.createElement('div');
            scoreEl.className = 'floating-score';
            scoreEl.innerText = scoreText;
            
            // Center the score over the cell
            scoreEl.style.top = `${top - 10}px`;
            scoreEl.style.left = `${left + (rect.width / 2) - 20}px`; // Rough centering based on text width
            
            document.getElementById('sudoku-grid').appendChild(scoreEl);
            
            // Remove after animation completes
            setTimeout(() => {
                scoreEl.remove();
            }, 1500);
        }

        // Staggered Entry for Sudoku Cells
        document.addEventListener('DOMContentLoaded', () => {
            const cells = document.querySelectorAll('.sudoku-cell');
            cells.forEach((cell, index) => {
                cell.style.animationDelay = `${index * 5}ms`;
            });
        });

        // Click interaction for cells: update active state and show floating points
        document.querySelectorAll('.sudoku-cell').forEach(cell => {
            cell.addEventListener('click', (e) => {
                // Remove active class from previously active cell
                document.querySelectorAll('.cell-active').forEach(c => c.classList.remove('cell-active'));
                
                // Add active class to clicked cell
                e.currentTarget.classList.add('cell-active');
                
                // Show floating score
                showFloatingScore(e.currentTarget, "+100");
                
                // Sound effect
                const audio = new Audio('https://www.soundjay.com/buttons/sounds/button-16.mp3');
                audio.volume = 0.1;
                audio.play().catch(() => {});
            });
        });

        // Number Pad Interaction
        document.querySelectorAll('.keypad-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const activeCell = document.querySelector('.cell-active');
                if (activeCell) {
                    // Trigger pop animation
                    activeCell.classList.remove('cell-pop');
                    void activeCell.offsetWidth; // trigger reflow
                    activeCell.classList.add('cell-pop');
                }
                
                const audio = new Audio('https://www.soundjay.com/buttons/sounds/button-16.mp3');
                audio.volume = 0.2;
                audio.play().catch(() => {});
            });
        });

        // No need for mousemove background parallax as we have CSS animated ambient background now
    </script>
