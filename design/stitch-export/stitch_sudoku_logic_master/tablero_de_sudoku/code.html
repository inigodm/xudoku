<script>
        // Simple micro-interaction for the numbers
        document.querySelectorAll('.btn-3d-primary').forEach(btn => {
            btn.addEventListener('click', () => {
                const audio = new Audio('https://www.soundjay.com/buttons/sounds/button-16.mp3');
                audio.volume = 0.2;
                audio.play().catch(() => {});
            });
        });

        // Add some subtle parallax or glow movement to the background
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            document.body.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, #131b2e 0%, #0b1326 100%)`;
        });
    </script>
</body></html>
