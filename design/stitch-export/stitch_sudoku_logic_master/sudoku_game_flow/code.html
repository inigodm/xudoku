<!DOCTYPE html>

<html class="dark" lang="es"><head>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "surface-tint": "#c0c1ff",
                        "surface-container-high": "#222a3d",
                        "tertiary-fixed": "#acedff",

                        "on-surface-variant": "#c7c4d7",
                        "tertiary-container": "#009eb9",
                        "tertiary": "#4cd7f6",
                        "secondary-container": "#6f00be",
                        "on-tertiary-container": "#002f38",
                        "secondary": "#ddb7ff",
                        "surface-bright": "#31394d",
                        "on-secondary-fixed": "#2c0051",
                        "error": "#ffb4ab",
                        "on-error": "#690005",
                        "on-background": "#dae2fd",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .btn-3d {
            transition: transform 0.1s ease-out, background-color 0.2s;
            position: relative;
        }
        .btn-3d:active {
            transform: translateY(3px);
        }
        .glass-panel {
            background: rgba(23, 31, 51, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow-green { box-shadow: 0 0 15px rgba(76, 215, 246, 0.3); } /* Cyan for easy */
        .neon-glow-yellow { box-shadow: 0 0 15px rgba(214, 169, 255, 0.3); } /* Purple for medium */
        .neon-glow-orange { box-shadow: 0 0 15px rgba(128, 131, 255, 0.3); } /* Primary for difficult */
        .neon-glow-red { box-shadow: 0 0 15px rgba(147, 0, 10, 0.3); } /* Error for extreme */
        
        body {
            background: radial-gradient(circle at top center, #171f33 0%, #0b1326 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-on-background font-body-md overflow-x-hidden">
<!-- Top Navigation Bar -->
<header class="w-full top-0 sticky bg-background/80 backdrop-blur-xl z-50 flex justify-between items-center px-container-padding py-stack-md">
<button class="text-primary hover:opacity-80 active:translate-y-1 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-display-lg text-headline-lg-mobile tracking-tighter text-primary">SUDOKU</h1>
<button class="text-primary hover:opacity-80 active:translate-y-1 transition-transform">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<main class="flex flex-col items-center px-container-padding pb-32 pt-8 max-w-lg mx-auto">
<!-- Logo Section -->
<div class="mb-stack-lg relative group">
<div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full transition-opacity group-hover:opacity-100 opacity-60"></div>
<img alt="Sudoku Master Logo" class="w-32 h-32 md:w-40 md:h-40 rounded-3xl relative z-10 shadow-2xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1ocYophFGRS67PCpTNXe3Szq08c1-eCUX-TRDcatjs-nwzLWR6LayTRfufhdDxrH7PNF7Is9ycng_s2Qw0zRqwUi_bHciz-VqNKZ6B1gpwjS8mEi2CJiTEtHvqbqHgkhRYdxkxmd0fiuHHIMLvr-bzp23iTKAuEFMYfjMMslJDl1s_5WbgCAWwK7lKh_ur1qR45kv3cHUZMB1Iwb5y0iSnmd6NsjumJeB_3pM-aWxUoJlWmTmTwjsiK3KarWv3d6kkFPC0mTfNAJl"/>
</div>
<!-- Headline -->
<div class="text-center mb-10">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-2">Selecciona Dificultad</h2>
<p class="text-outline font-label-lg text-label-lg uppercase tracking-widest">Pon a prueba tu mente</p>
</div>
<!-- Difficulty Grid -->
<div class="w-full space-y-6">
<!-- Easy (Fácil) - Tertiary / Cyan -->
<button class="w-full btn-3d group relative overflow-hidden">
<div class="absolute inset-0 bg-[#004e5c] rounded-xl translate-y-1"></div>
<div class="relative bg-tertiary-container hover:bg-tertiary transition-colors rounded-xl p-6 flex items-center justify-between neon-glow-green border border-white/10">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-on-tertiary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-on-tertiary-fixed">sentiment_satisfied</span>
</div>
<div class="text-left">
<span class="block font-headline-lg-mobile text-headline-lg-mobile text-on-tertiary-container">Fácil</span>
<span class="block font-label-sm text-label-sm text-on-tertiary-container/80">35+ Números dados</span>
</div>
</div>
<span class="material-symbols-outlined text-on-tertiary-container opacity-0 group-hover:opacity-100 transition-opacity translate-x-4 group-hover:translate-x-0">chevron_right</span>
</div>
</button>
<!-- Medium (Medio) - Secondary / Purple -->
<button class="w-full btn-3d group relative overflow-hidden">
<div class="absolute inset-0 bg-[#490080] rounded-xl translate-y-1"></div>
<div class="relative bg-secondary-container hover:bg-on-secondary-container transition-colors rounded-xl p-6 flex items-center justify-between neon-glow-yellow border border-white/10">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-white/10 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary">sentiment_neutral</span>
</div>
<div class="text-left">
<span class="block font-headline-lg-mobile text-headline-lg-mobile text-on-secondary-fixed">Medio</span>
<span class="block font-label-sm text-label-sm text-secondary-fixed">28-34 Números dados</span>
</div>
</div>
<span class="material-symbols-outlined text-white opacity-0 group-hover:opacity-100 transition-opacity translate-x-4 group-hover:translate-x-0">chevron_right</span>
</div>
</button>
<!-- Hard (Difícil) - Primary / Indigo -->
<button class="w-full btn-3d group relative overflow-hidden">
<div class="absolute inset-0 bg-[#2f2ebe] rounded-xl translate-y-1"></div>
<div class="relative bg-primary-container hover:bg-primary transition-colors rounded-xl p-6 flex items-center justify-between neon-glow-orange border border-white/10">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-on-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container">psychology</span>
</div>
<div class="text-left">
<span class="block font-headline-lg-mobile text-headline-lg-mobile text-on-primary-container">Difícil</span>
<span class="block font-label-sm text-label-sm text-on-primary-container/80">22-27 Números dados</span>
</div>
</div>
<span class="material-symbols-outlined text-on-primary-container opacity-0 group-hover:opacity-100 transition-opacity translate-x-4 group-hover:translate-x-0">chevron_right</span>
</div>
</button>
<!-- Extreme (Extremo) - Error / Red -->
<button class="w-full btn-3d group relative overflow-hidden">
<div class="absolute inset-0 bg-[#690005] rounded-xl translate-y-1"></div>
<div class="relative bg-error-container hover:bg-error transition-colors rounded-xl p-6 flex items-center justify-between neon-glow-red border border-white/10">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-on-error-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-on-error-container" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<div class="text-left">
<span class="block font-headline-lg-mobile text-headline-lg-mobile text-on-error-container">Extremo</span>
<span class="block font-label-sm text-label-sm text-on-error-container/80">&lt; 22 Números dados</span>
</div>
</div>
<span class="material-symbols-outlined text-on-error-container opacity-0 group-hover:opacity-100 transition-opacity translate-x-4 group-hover:translate-x-0">chevron_right</span>
</div>
</button>
</div>
<!-- Decorative Progress Element -->
<div class="mt-stack-lg w-full glass-panel rounded-2xl p-4">
<div class="flex justify-between items-center mb-2">
<span class="font-label-lg text-label-lg text-on-surface-variant">Progreso Global</span>
<span class="font-label-lg text-label-lg text-tertiary">45%</span>
</div>
<div class="h-3 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-tertiary to-primary-container transition-all duration-1000" style="width: 45%;"></div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 pb-6 pt-3 bg-surface-container-low/90 backdrop-blur-md rounded-t-xl shadow-[0_-4px_20px_rgba(0,0,0,0.4)] border-t border-outline-variant/20">
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full w-12 h-12 active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined">grid_view</span>
</a>
<a class="flex flex-col items-center justify-center text-outline w-12 h-12 hover:text-primary transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined">leaderboard</span>
</a>
<a class="flex flex-col items-center justify-center text-outline w-12 h-12 hover:text-primary transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined">emoji_events</span>
</a>
<a class="flex flex-col items-center justify-center text-outline w-12 h-12 hover:text-primary transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined">person</span>
</a>
</nav>
<script>
        // Micro-interaction: Mouse position parallax for the logo
        const logo = document.querySelector('.group img');
        if (logo) {
            document.addEventListener('mousemove', (e) => {
                const { clientX, clientY } = e;
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const moveX = (clientX - centerX) / 50;
                const moveY = (clientY - centerY) / 50;
                
                logo.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        }

        // Difficulty selection hover haptics (visual simulation)
        const buttons = document.querySelectorAll('.btn-3d');
        buttons.forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                btn.querySelector('.neon-glow-green, .neon-glow-yellow, .neon-glow-orange, .neon-glow-red').style.boxShadow = '0 0 25px rgba(255, 255, 255, 0.4)';
            });
            btn.addEventListener('mouseleave', () => {
                // Reset to default shadows - simplified since we're using static classes
                btn.querySelector('.neon-glow-green, .neon-glow-yellow, .neon-glow-orange, .neon-glow-red').style.boxShadow = '';
            });
        });
    </script>
</body></html>
